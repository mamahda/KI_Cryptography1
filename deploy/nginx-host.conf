# Host nginx site: forwards everything on port 80 to the frontend container
# (published on 127.0.0.1:3000), which in turn proxies /api to the backend.
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/ki-vault
#   sudo ln -sf /etc/nginx/sites-available/ki-vault /etc/nginx/sites-enabled/ki-vault
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Videos can be up to 200 MB.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
