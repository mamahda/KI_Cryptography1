services:
  mysql:
    image: mysql:8.4
    container_name: vault-mysql
    environment:
      MYSQL_DATABASE: vault
      MYSQL_USER: vault
      MYSQL_PASSWORD: vault
      MYSQL_ROOT_PASSWORD: root
    # Host port 3307 so it does not clash with a locally installed MySQL/MariaDB.
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
